name: CICD

on:
  push:
    branches: [main]

jobs:
  # Single deploy job since we're just deploying
  deploy:
    runs-on: [ubuntu-latest]
    steps:
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Login to aws
        run: aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }} --profile break-point-frontend-s3 && aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }} --profile break-point-frontend-s3 && aws configure set region ${{ secrets.AWS_DEFAULT_REGION }} --profile break-point-frontend-s3 && aws configure set output "text" --profile break-point-frontend-s3
      - name: Upload to S3
        run: aws s3 sync ./dist s3://break-point-frontend
        env:
          VITE_BASE_URL_BACKEND: ${{ secrets.VITE_BASE_URL_BACKEND }}
        #   AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        #   AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # AWS_DEFAULT_REGION: 'sa-east-1'
          
          
          
