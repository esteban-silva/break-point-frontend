name: CICD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
        env:
          VITE_BASE_URL_BACKEND: ${{ secrets.VITE_BASE_URL_BACKEND }}
      - name: Login to aws
        run: aws configure set aws_access_key_id "${{ secrets.AWS_ACCESS_KEY_ID }}" && aws configure set aws_secret_access_key "${{ secrets.AWS_SECRET_ACCESS_KEY }}" && aws configure set region "${{ secrets.AWS_DEFAULT_REGION }}" && aws configure set output "text"
      - name: Upload to S3
        run: aws s3 sync ./dist s3://break-point-frontend